<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        html, body{
    height: 100%;
    margin: 0;
    padding: 10px;
    box-sizing: border-box;
}

header, footer{
    background-color: #00bfa5;
    height: 10%;
    display: flex;
    justify-content: center;
    align-items: center;
}

aside, article, header, footer{
    margin: 5px;
    
}

header{
    margin-top: 0;
}

article{
    background-color: #fbb03b;
    width: 70%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: end;
}

aside{
    width: 30%;
    background-color: #7cd660;
    display: flex;
    justify-content: center;
    align-items: center;
}

h1{
    font-size: 3em;
}

#flex{
    display: flex;
    height: 80%;

}

#Image{
    display: flex;
    width: 100%;
    height: 40%;
    box-sizing: border-box;
    padding: 10px;
}

#img{
    background-color: green;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 10px;
}
    </style>
</head>
<body>
    <header><h1>Header</h1></header>

    <div id="flex">
        <aside><h1>Aside</h1></aside>
        <article>
            <h1>Article</h1>
            <div id="Image">
                <div id="img"><h1>Image</h1></div>
                <div id="img"><h1>Image</h1></div>
                <div id="img"><h1>Image</h1></div>
            </div>
        </article>
        
    </div>

    <footer><h1>Footer</h1></footer>
</body>
</html>
